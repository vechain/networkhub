name: Pull Request CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-unit-tests:
    name: Run Unit Tests
    uses: ./.github/workflows/test.yaml

  lint:
    name: Lint
    uses: ./.github/workflows/lint-go.yaml
    with:
      # incremental on PRs; full-tree scan on merges to main
      only-new-issues: ${{ github.event_name == 'pull_request' }}

